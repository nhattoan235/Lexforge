<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đang mở Lexforge</title>
    <style>
      :root { font-family: "Segoe UI", system-ui, sans-serif; color: #f5f7fc; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: #171b29; }
      main { width: 100%; height: 100%; padding: 35px 37px; border: 1px solid #354057; }
      .brand { display: flex; align-items: center; gap: 14px; }
      .brand img { width: 52px; height: 52px; }
      h1 { margin: 0; font-size: 23px; font-weight: 750; letter-spacing: -0.4px; }
      .subtitle { margin-top: 3px; color: #aebcd1; font-size: 13px; }
      .message { margin: 38px 0 14px; color: #e7ecf7; font-size: 14px; }
      .track { width: 100%; height: 5px; overflow: hidden; border-radius: 10px; background: #30394e; }
      .progress { width: 36%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #60d9bb, #fc7086); animation: loading 1.6s ease-in-out infinite alternate; }
      @keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(280%); } }
      @media (prefers-reduced-motion: reduce) { .progress { animation: none; width: 65%; } }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div class="brand">
        <img src="../public/lexforge-mark.svg" alt="" />
        <div><h1>Lexforge</h1><div class="subtitle">Trợ lý tiếng Anh của bạn</div></div>
      </div>
      <p class="message">Đang chuẩn bị không gian học tập…</p>
      <div class="track" aria-hidden="true"><div class="progress"></div></div>
    </main>
  </body>
</html>
